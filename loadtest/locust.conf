# Defaults for `locust` run from this folder. Override any of them on the command line.
locustfile = locustfile.py
host = http://localhost:8085
headless = true
# Locust's own request statistics; the slot report is written next to it as reports/slot-run-<timestamp>.html
html = reports/locust-stats.html
# The load shape in locustfile.py sets users and phases; these are ignored but keep Locust quiet.
users = 1
spawn-rate = 1
